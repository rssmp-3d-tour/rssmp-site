name: Сайт — сборка и проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Сборка и проверки
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Зависимости тестов и Chromium
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Аудит зависимостей
        run: |
          npm audit --package-lock-only --audit-level=high --prefix tests
          npm audit --package-lock-only --audit-level=high --prefix vendor-src

      - name: Все проверки (tests/run-all.sh)
        working-directory: tests
        run: bash run-all.sh

      - name: Сборки для Beget и GitHub Pages
        run: |
          python3 build_pages.py
          mkdir -p out
          cp -a dist out/beget
          RSSMP_TARGET=github python3 build_pages.py
          cp -a dist out/github-pages

      - name: Архив для Beget
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rssmp-beget
          path: out/beget
          include-hidden-files: true

      - name: Архив для GitHub Pages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rssmp-github-pages
          path: out/github-pages
          include-hidden-files: true

      - name: Скриншоты и отчёты упавших проверок
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            tests/results
            tests/results-vehicles
            tests/results-demo
          if-no-files-found: ignore
